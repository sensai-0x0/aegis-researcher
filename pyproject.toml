[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Evidence-driven security research intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
graph = ["neo4j>=5.0"]
cli = ["typer>=0.12"]
http = ["httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools]
packages = { find = { include = ["core*", "adapters*", "workers*", "graph*"] } }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
