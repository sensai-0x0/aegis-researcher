[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis"
version = "0.1.0"
description = "AEGIS Research Workbench — evidence-driven security research intelligence platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "click>=8.1",
]

[project.optional-dependencies]
graph = ["neo4j>=5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
aegis = "adapters.cli.main:main"

[tool.hatch.build.targets.wheel]
# Root-level packages per .agents/plans/init.md §3.6–3.7.
packages = ["core", "adapters", "graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Structural/safety tests must never be skipped silently.
xfail_strict = true
markers = [
    "contract: JSON Schema contract conformance, driven by .agents/curriculum.json",
    "unit: core-module behavior specs (TDD — tests define the API before it exists)",
    "safety: authorization, policy-gating and audit-integrity guarantees",
    "evals: eval-harness integrity (registry/runner sync, gates, ratchet)",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
