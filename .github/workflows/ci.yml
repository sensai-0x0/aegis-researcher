name: CI

# AEGIS continuous-integrity gate (goal.md §Evolve: "regressions are caught,
# improvements compound").
#
# Three required jobs:
#   tests    — ruff lint + pytest with a coverage floor from tests/thresholds.json
#   evals    — the .agents/evals heuristic suite with its gates enforced (--strict)
#   ratchet  — PR-only: fails if any coverage/eval gate is LOWERED vs the base
#              branch. Gates may only tighten over time.
#
# NOTE: YAML cannot mark checks "required". Enable branch protection once:
#   Settings → Branches → main → Require status checks to pass before merging:
#     * tests (every matrix leg)     * evals     * ratchet
# Also enable "Require branches to be up to date before merging" so the
# ratchet compares against a fresh base.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install project + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Read ratchet floors
        run: |
          cov_floor="$(jq -r '.coverage.min_line_percent' tests/thresholds.json)"
          echo "COV_FLOOR=${cov_floor}" >> "$GITHUB_ENV"

      - name: Test suite (coverage-gated)
        run: >
          python -m pytest
          --cov=core --cov=graph --cov=adapters --cov=workers
          --cov-report=term-missing
          --cov-fail-under="$COV_FLOOR"

  evals:
    name: heuristic evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run eval suite (suite gates enforced)
        run: python .agents/evals/eval-suite/run_evals.py --strict

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: .agents/evals/results/latest.json
          if-no-files-found: ignore

  ratchet:
    name: gate ratchet (no loosening)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gates may only tighten vs base branch
        run: python tools/ci/check_ratchet.py --base "origin/${{ github.base_ref }}"
